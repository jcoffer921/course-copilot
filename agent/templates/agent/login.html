{% load static %}
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — OnTrack</title>
<link rel="stylesheet" href="{% static 'agent/_ds/organic-c88e3875-74a6-464a-a40a-c20107e2cc25/styles.css' %}">
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
  .login-wrap{width:100%;max-width:340px;padding:0 var(--space-4);display:flex;flex-direction:column;align-items:center}
  .brand-mark{width:96px;height:96px;margin-bottom:var(--space-4)}
  .brand-mark img{width:100%;height:100%;display:block}
  .login-card{width:100%;background:var(--color-surface);border-radius:calc(var(--radius-lg) * 1.15);box-shadow:var(--shadow-md);padding:var(--space-8) var(--space-6);display:flex;flex-direction:column;align-items:stretch;text-align:center;gap:var(--space-2)}
  .login-card h1{font-family:var(--font-heading);font-weight:var(--font-heading-weight);font-size:26px;margin:0 0 4px;line-height:1.15}
  .login-card .sub{margin:0 0 var(--space-4);font-size:14px;opacity:.7;line-height:1.5}
  .login-error{display:flex;align-items:flex-start;gap:8px;text-align:left;background:var(--color-accent-100);color:var(--color-accent-800);border-radius:var(--radius-md);padding:11px 14px;font-size:13px;margin-bottom:var(--space-4);line-height:1.45}
  .login-error svg{flex:none;margin-top:2px}
  .google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:46px;background:#fff;color:#3c4043;border:1px solid color-mix(in srgb, var(--color-text) 18%, transparent);border-radius:999px;font-family:var(--font-body);font-weight:600;font-size:14.5px;text-decoration:none}
  .google-btn:hover{background:#f8f8f8;color:#3c4043}
  .login-footnote{margin-top:var(--space-4);font-size:12px;opacity:.55}
</style>
</head>
<body>
  <div class="login-wrap">
    <div class="brand-mark"><img src="{% static 'agent/images/ontrack-trans.png' %}" alt="OnTrack"></div>

    <div class="login-card">
      <h1>Welcome to OnTrack</h1>
      <p class="sub">Sign in with your Google account to get started.</p>

      {% for message in messages %}
        <div class="login-error">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
          <span>{{ message }}</span>
        </div>
      {% endfor %}

      <a class="google-btn" href="{% url 'google-login-start' %}">
        <svg width="18" height="18" viewBox="0 0 48 48">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
          <path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.1-11.3-7.8l-6.5 5C9.6 39.6 16.3 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.1 5.6l6.2 5.2C40.9 36 44 30.9 44 24c0-1.3-.1-2.7-.4-3.5z"/>
        </svg>
        Sign in with Google
      </a>

      <div class="login-footnote">Only approved accounts can sign in.</div>
    </div>
  </div>
</body>
</html>
