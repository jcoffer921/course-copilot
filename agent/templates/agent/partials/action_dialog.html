<div id="ontrack-action-dialog" class="action-dialog-backdrop is-closed" hidden aria-hidden="true">
  <section class="action-dialog" role="dialog" aria-modal="true" aria-labelledby="action-dialog-title" aria-describedby="action-dialog-message">
    <p id="action-dialog-kicker" class="action-dialog-kicker">Please confirm</p>
    <h2 id="action-dialog-title">Confirm action</h2>
    <p id="action-dialog-message"></p>
    <label id="action-dialog-input-wrap" class="is-closed" hidden><span id="action-dialog-input-label"></span><input id="action-dialog-input" class="input" autocomplete="off"></label>
    <p id="action-dialog-validation" class="action-dialog-validation is-closed" role="alert" hidden></p>
    <footer><button id="action-dialog-cancel" class="btn btn-secondary" type="button">Cancel</button><button id="action-dialog-confirm" class="btn btn-primary" type="button">Continue</button></footer>
  </section>
</div>
